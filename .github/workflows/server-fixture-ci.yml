name: "server-fixture-ci"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'release-*'
    paths:
      - .github/actions/get-hugegraph-commit/**
      - .github/actions/setup-hugegraph-server/**
      - .github/workflows/server-fixture-ci.yml
      - hugegraph-client/assembly/travis/*server*
      - hugegraph-client/assembly/travis/install-hugegraph-from-source.sh
      - hugegraph-loader/assembly/travis/install-hugegraph-from-source.sh
      - hugegraph-tools/assembly/travis/install-hugegraph-from-source.sh
      - hugegraph-spark-connector/assembly/travis/install-hugegraph-from-source.sh
  pull_request:
    paths:
      - .github/actions/get-hugegraph-commit/**
      - .github/actions/setup-hugegraph-server/**
      - .github/workflows/server-fixture-ci.yml
      - hugegraph-client/assembly/travis/*server*
      - hugegraph-client/assembly/travis/install-hugegraph-from-source.sh
      - hugegraph-loader/assembly/travis/install-hugegraph-from-source.sh
      - hugegraph-tools/assembly/travis/install-hugegraph-from-source.sh
      - hugegraph-spark-connector/assembly/travis/install-hugegraph-from-source.sh

permissions:
  contents: read

# Keep the newest PR run; preserve independent push, release and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-fixture-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test server selection, checkout and installation
        run: |
          node --test .github/actions/get-hugegraph-commit/resolve.test.cjs \
            hugegraph-client/assembly/travis/checkout-server.test.cjs \
            hugegraph-client/assembly/travis/install-server.test.cjs
