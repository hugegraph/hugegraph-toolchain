name: "java-client-ci"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'release-*'
    paths:
      - hugegraph-client/**
      - hugegraph-dist/**
      - .github/workflows/**
      - .github/actions/**
      - pom.xml
  pull_request:
    paths:
      - hugegraph-client/**
      - hugegraph-dist/**
      - .github/workflows/**
      - .github/actions/**
      - pom.xml

jobs:
  client-ci:
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'true' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-client/assembly/travis
    strategy:
      fail-fast: false
      matrix:
        JAVA_VERSION: [ '17' ]

    steps:
      - name: Fetch code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Test server baseline resolver
        run: |
          node --test .github/actions/get-hugegraph-commit/resolve.test.cjs \
            hugegraph-client/assembly/travis/checkout-server.test.cjs
          bash -n hugegraph-client/assembly/travis/checkout-server.sh \
            hugegraph-client/assembly/travis/install-hugegraph-from-source.sh

      - name: Resolve locked Java 17 server baseline
        id: get-commit
        uses: ./.github/actions/get-hugegraph-commit
        with:
          repository: hugegraph/hugegraph
          ref: codex/cypher-minimal-compat
          expected-commit: 4fa9413b139060649cc136aea116ec3261a8a05a

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'zulu'
          use-stage: ${{ env.USE_STAGE }}

      - name: Isolate candidate Maven artifacts
        run: |
          candidate_repo=$(mktemp -d "$RUNNER_TEMP/java17-candidate-m2.XXXXXX")
          printf 'MAVEN_ARGS=-Dmaven.repo.local=%s\n' "$candidate_repo" >> "$GITHUB_ENV"

      - name: Setup HugeGraph server
        uses: ./.github/actions/setup-hugegraph-server
        with:
          travis-dir: ${{ env.TRAVIS_DIR }}
          commit-id: ${{ steps.get-commit.outputs.commit_id }}
          repository: hugegraph/hugegraph
          fetch-ref: ${{ steps.get-commit.outputs.fetch_ref }}

      - name: Compile
        run: |
          mvn -e compile -pl hugegraph-client -Dmaven.javadoc.skip=true -ntp

      - name: Run test
        run: |
          cd hugegraph-client
          mvn test -Dtest=UnitTestSuite -ntp
          mvn test -Dtest=ApiTestSuite
          mvn test -Dtest=FuncTestSuite

      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: hugegraph-client/target/jacoco.xml
