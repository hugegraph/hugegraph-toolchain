name: "java-client-ci"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'release-*'
    paths:
      - hugegraph-client/**
      - hugegraph-dist/**
      - .github/workflows/**
      - .github/actions/**
      - pom.xml
  pull_request:
    paths:
      - hugegraph-client/**
      - hugegraph-dist/**
      - .github/workflows/**
      - .github/actions/**
      - pom.xml

# Keep the newest PR run; preserve independent push, release and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-ci:
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'false' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-client/assembly/travis
    strategy:
      fail-fast: false
      matrix:
        JAVA_VERSION: ['17']
        SERVER_BASELINE: ['candidate', 'release-1.7']

    steps:
      - name: Fetch code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install released Server JVM
        if: matrix.SERVER_BASELINE == 'release-1.7'
        id: released-java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          overwrite-settings: false

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'zulu'
          use-stage: ${{ env.USE_STAGE }}

      - name: Install locked candidate SDK
        id: candidate-sdk
        uses: ./.github/actions/setup-candidate-sdk

      - name: Resolve released Server 1.7 fixture
        if: matrix.SERVER_BASELINE == 'release-1.7'
        id: get-commit
        uses: ./.github/actions/get-hugegraph-commit
        with:
          ref: 'refs/tags/1.7.0'
          expected-commit: 'b12425c2032bf0d21a97b8221f42a18055c2982f'

      - name: Setup HugeGraph server
        if: matrix.SERVER_BASELINE == 'release-1.7'
        uses: ./.github/actions/setup-hugegraph-server
        with:
          travis-dir: ${{ env.TRAVIS_DIR }}
          commit-id: ${{ steps.get-commit.outputs.commit_id }}
          repository: ${{ steps.get-commit.outputs.repository }}
          fetch-ref: ${{ steps.get-commit.outputs.fetch_ref }}
          java-home: ${{ steps.released-java.outputs.path }}
          isolate-maven-repo: 'true'

      - name: Start candidate Server fixture
        if: matrix.SERVER_BASELINE == 'candidate'
        env:
          CANDIDATE_ARCHIVE: ${{ steps.candidate-sdk.outputs.archive }}
        run: bash hugegraph-client/assembly/travis/start-hugegraph-servers.sh "$CANDIDATE_ARCHIVE"

      - name: Compile
        run: |
          mvn -e compile -pl hugegraph-client -Dmaven.javadoc.skip=true -ntp

      - name: Run test
        run: |
          cd hugegraph-client
          mvn test -Dtest=UnitTestSuite -ntp
          mvn test -Dtest=ApiTestSuite
          mvn test -Dtest=FuncTestSuite

      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: hugegraph-client/target/jacoco.xml
