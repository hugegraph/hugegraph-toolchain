name: "loader-ci"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'release-*'
    paths:
      - hugegraph-loader/**
      - hugegraph-dist/**
      - .github/workflows/**
      - .github/actions/**
      - pom.xml
  pull_request:
    paths:
      - hugegraph-loader/**
      - hugegraph-dist/**
      - hugegraph-client/**
      - .github/workflows/**
      - .github/actions/**
      - pom.xml

jobs:
  loader-ci:
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'true' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-loader/assembly/travis
      STATIC_DIR: hugegraph-loader/assembly/static
      DB_USER: root
      DB_PASS: root
      DB_DATABASE: load_test
    strategy:
      fail-fast: false
      matrix:
        SERVER_BASELINE: [ 'candidate', 'release-1.7' ]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Fetch Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Resolve locked Java 17 server baseline
        id: get-commit
        uses: ./.github/actions/get-hugegraph-commit
        with:
          repository: hugegraph/hugegraph
          ref: codex/cypher-minimal-compat
          expected-commit: 59ad5374b4bf90ec3ee7aa133b830e66788b51ec

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: '17'
          distribution: 'temurin'
          use-stage: ${{ env.USE_STAGE }}

      - name: Cache Hadoop
        uses: actions/cache@v6
        with:
          path: ~/hadoop-3.3.6.tar.gz
          key: ${{ runner.os }}-hadoop-3.3.6

      - name: Isolate candidate Maven artifacts
        run: |
          candidate_repo=$(mktemp -d "$RUNNER_TEMP/java17-candidate-m2.XXXXXX")
          server_build=$(mktemp -d "$RUNNER_TEMP/hugegraph-build.XXXXXX")
          printf 'SERVER_BUILD_DIR=%s\n' "$server_build" >> "$GITHUB_ENV"
          printf 'MAVEN_ARGS=-Dmaven.repo.local=%s\n' "$candidate_repo" >> "$GITHUB_ENV"

      - name: Install candidate dependencies for both server baselines
        env:
          SERVER_COMMIT: ${{ steps.get-commit.outputs.commit_id }}
          SERVER_REPOSITORY: hugegraph/hugegraph
          SERVER_FETCH_REF: ${{ steps.get-commit.outputs.fetch_ref }}
        run: |
          cd "$SERVER_BUILD_DIR"
          bash "$GITHUB_WORKSPACE/hugegraph-client/assembly/travis/install-hugegraph-from-source.sh" \
            "$SERVER_COMMIT" --build-only

      - name: Install legacy server JVM
        if: matrix.SERVER_BASELINE == 'release-1.7'
        id: legacy-java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          overwrite-settings: false

      - name: Start official Server 1.7 with Java 11
        if: matrix.SERVER_BASELINE == 'release-1.7'
        env:
          JAVA_HOME: ${{ steps.legacy-java.outputs.path }}
        run: |
          archive="$RUNNER_TEMP/apache-hugegraph-incubating-1.7.0.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/apache/hugegraph/releases/download/1.7.0/apache-hugegraph-incubating-1.7.0.tar.gz \
            --output "$archive"
          printf 'e9b95b5afac156f251a12134a03a27579cca9ed7cca7e42ad0529e639b1cde1e  %s\n' "$archive" | sha256sum --check
          bash hugegraph-client/assembly/travis/start-hugegraph-servers.sh "$archive"

      - name: Restore Loader Java 17
        if: matrix.SERVER_BASELINE == 'release-1.7'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          overwrite-settings: false

      - name: Start candidate Server with Java 17
        if: matrix.SERVER_BASELINE == 'candidate'
        run: |
          archives=("$SERVER_BUILD_DIR"/hugegraph/hugegraph-server/apache-hugegraph-*.tar.gz)
          [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" ]]
          bash hugegraph-client/assembly/travis/start-hugegraph-servers.sh "${archives[0]}"

      - name: Compile
        run: |
          mvn install -pl hugegraph-client,hugegraph-loader -am -Dmaven.javadoc.skip=true -DskipTests -ntp

      - name: Prepare Hadoop service
        run: bash "$TRAVIS_DIR/install-hadoop.sh"

      - name: Run test
        run: |
          cd hugegraph-loader && ls
          mvn test -P unit -ntp
          mvn test -P file
          mvn test -P hdfs
          mvn test -P jdbc
          mvn test -P kafka

      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: hugegraph-loader/target/jacoco.xml
