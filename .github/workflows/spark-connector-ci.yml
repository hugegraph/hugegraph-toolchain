name: "spark-connector-ci"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'release-*'
    paths:
      - hugegraph-spark-connector/**
      - hugegraph-dist/**
      - .github/workflows/**
      - .github/actions/**
      - pom.xml
  pull_request:
    paths:
      - hugegraph-spark-connector/**
      - hugegraph-dist/**
      - hugegraph-client/**
      - .github/workflows/**
      - .github/actions/**
      - pom.xml

# Keep the newest PR run; preserve independent push, release and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spark-connector-ci:
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'false' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-spark-connector/assembly/travis
    strategy:
      matrix:
        JAVA_VERSION: ['17']

    steps:
      - name: Fetch Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install released Server JVM
        id: released-java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          overwrite-settings: false

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'temurin'
          use-stage: ${{ env.USE_STAGE }}

      - name: Install locked candidate SDK
        id: candidate-sdk
        uses: ./.github/actions/setup-candidate-sdk

      - name: Resolve released Server 1.7 fixture
        id: get-commit
        uses: ./.github/actions/get-hugegraph-commit
        with:
          ref: 'refs/tags/1.7.0'
          expected-commit: 'b12425c2032bf0d21a97b8221f42a18055c2982f'


      - name: Compile
        run: |
          mvn install -pl hugegraph-client,hugegraph-spark-connector -am -Dmaven.javadoc.skip=true -DskipTests -ntp

      - name: Setup HugeGraph server
        uses: ./.github/actions/setup-hugegraph-server
        with:
          travis-dir: ${{ env.TRAVIS_DIR }}
          commit-id: ${{ steps.get-commit.outputs.commit_id }}
          repository: ${{ steps.get-commit.outputs.repository }}
          fetch-ref: ${{ steps.get-commit.outputs.fetch_ref }}
          java-home: ${{ steps.released-java.outputs.path }}
          isolate-maven-repo: 'true'

      - name: Run test
        run: |
          cd hugegraph-spark-connector && ls
          mvn test
