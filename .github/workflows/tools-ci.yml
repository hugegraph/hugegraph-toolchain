name: "tools-ci"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'release-*'
    paths:
      - hugegraph-tools/**
      - hugegraph-dist/**
      - hugegraph-client/**
      - .github/workflows/**
      - .github/actions/**
      - pom.xml
  pull_request:
    paths:
      - hugegraph-tools/**
      - hugegraph-dist/**
      - hugegraph-client/**
      - .github/workflows/**
      - .github/actions/**
      - pom.xml

jobs:
  tools-ci:
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'true' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-tools/assembly/travis
    strategy:
      matrix:
        JAVA_VERSION: [ '17' ]

    steps:
      - name: Fetch Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Resolve locked Java 17 server baseline
        id: get-commit
        uses: ./.github/actions/get-hugegraph-commit
        with:
          repository: hugegraph/hugegraph
          ref: codex/cypher-minimal-compat
          expected-commit: 59ad5374b4bf90ec3ee7aa133b830e66788b51ec

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'temurin'
          use-stage: ${{ env.USE_STAGE }}

      - name: Isolate candidate Maven artifacts
        run: |
          candidate_repo=$(mktemp -d "$RUNNER_TEMP/java17-tools-m2.XXXXXX")
          printf 'MAVEN_ARGS=-Dmaven.repo.local=%s\n' "$candidate_repo" >> "$GITHUB_ENV"

      - name: Setup HugeGraph server
        uses: ./.github/actions/setup-hugegraph-server
        with:
          travis-dir: ${{ env.TRAVIS_DIR }}
          commit-id: ${{ steps.get-commit.outputs.commit_id }}
          repository: hugegraph/hugegraph
          fetch-ref: ${{ steps.get-commit.outputs.fetch_ref }}

      - name: Compile
        run: |
          mvn install -pl hugegraph-client,hugegraph-tools -am -Dmaven.javadoc.skip=true -DskipTests -ntp

      - name: Run test
        run: |
          mvn test -Dtest=FuncTestSuite -pl hugegraph-tools -ntp
