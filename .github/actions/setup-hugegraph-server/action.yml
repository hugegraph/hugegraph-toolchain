name: 'Setup HugeGraph Server'
description: 'Prepare environment and install HugeGraph server from source'

inputs:
  travis-dir:
    description: 'Path to the Travis assembly directory containing install scripts'
    required: true
  commit-id:
    description: 'HugeGraph commit SHA to install'
    required: true

  repository:
    description: 'GitHub owner/repository containing the server source'
    default: 'apache/hugegraph'
  fetch-ref:
    description: 'Fetchable ref; the installer verifies its HEAD against commit-id'
    default: ''
  java-home:
    description: 'Optional fixture JVM, independent of the toolchain JVM'
    default: ''
  isolate-maven-repo:
    description: 'Build fixture packages in a separate repository without replacing SDK artifacts'
    default: 'false'

runs:
  using: composite
  steps:
    - name: Prepare env and service
      shell: bash
      env:
        TRAVIS_SCRIPT_DIR: ${{ inputs.travis-dir }}
        SERVER_COMMIT: ${{ inputs.commit-id }}
        SERVER_REPOSITORY: ${{ inputs.repository }}
        SERVER_FETCH_REF: ${{ inputs.fetch-ref }}
        FIXTURE_JAVA_HOME: ${{ inputs.java-home }}
        ISOLATE_FIXTURE_REPO: ${{ inputs.isolate-maven-repo }}
      run: |
        installer=$(realpath "${TRAVIS_SCRIPT_DIR}/install-hugegraph-from-source.sh")
        server_build=$(mktemp -d "$RUNNER_TEMP/hugegraph-build.XXXXXX")
        if [[ -n "$FIXTURE_JAVA_HOME" ]]; then
          export JAVA_HOME="$FIXTURE_JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
        fi
        if [[ "$ISOLATE_FIXTURE_REPO" == 'true' ]]; then
          fixture_repo=$(mktemp -d "$RUNNER_TEMP/hugegraph-fixture-m2.XXXXXX")
          export MAVEN_ARGS="-Dmaven.repo.local=$fixture_repo"
          export MAVEN_OPTS="${MAVEN_OPTS:-} -Dmaven.repo.local=$fixture_repo"
        fi
        cd "$server_build"
        bash "$installer" "$SERVER_COMMIT"
