name: Setup Spark runtime
description: Extract the pinned official Spark 3.5.8 runtime for Java 17 engine tests
outputs:
  home:
    description: Local Spark runtime directory
    value: ${{ steps.runtime.outputs.home }}
runs:
  using: composite
  steps:
    - name: Install Spark 3.5.8 from the official image
      id: runtime
      shell: bash
      run: |
        image='apache/spark:3.5.8-scala2.12-java17-ubuntu@sha256:9577096950d62dd59994f84cc3a0902fdae994a4bf238933f2fdca22053e5adb'
        docker pull --platform linux/amd64 "$image"
        container=$(docker create --platform linux/amd64 "$image" /bin/true)
        trap 'docker rm -f "$container" >/dev/null' EXIT
        spark_home="$RUNNER_TEMP/spark-3.5.8"
        docker cp "$container:/opt/spark" "$spark_home"
        grep -q '^Spark 3\.5\.8 ' "$spark_home/RELEASE"
        test -x "$spark_home/bin/spark-submit"
        # Keep the launcher and independent executor on the job's Java 17 runtime.
        mkdir -p "$spark_home/conf" "$spark_home/work"
        printf 'home=%s\n' "$spark_home" >> "$GITHUB_OUTPUT"
